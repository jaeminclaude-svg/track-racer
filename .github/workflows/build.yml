name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q TrackRacerApp.zip
          chmod -R u+w TrackRacerApp
          cp -f index.html TrackRacerApp/app/src/main/assets/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
        working-directory: TrackRacerApp
      - run: cp TrackRacerApp/app/build/outputs/apk/debug/app-debug.apk TrackRacer.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Track Racer APK
          files: TrackRacer.apk
